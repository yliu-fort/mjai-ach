[project]
name = "mjai-ach"
version = "0.1.0"
description = "IMPALA-style PPO/ACH + league-play research pipeline for imperfect-information games"
readme = "AGENTS.md"
requires-python = "==3.12.*"
license = { text = "MIT" }
authors = [{ name = "mjai-ach contributors" }]

# Runtime deps are pinned loosely at the major boundary; uv.lock freezes exact versions.
# Rationale per AGENTS.md D7: Python is fixed at 3.12.*; the rest is locked via uv.lock.
dependencies = [
    # Numerics / tensors (D1: PyTorch). CUDA 12.8 wheel is selected by the index URL
    # in [tool.uv.sources] / [tool.uv] below — installs the cu128 build.
    "torch>=2.5,<3",
    "numpy>=1.26,<3",
    # Game environments (D8): all 7 games live in OpenSpiel.
    "open-spiel>=2.0.1,<3",
    # IMPALA-style distributed execution (D2: Ray). Core logic is Ray-free; this
    # drives the worker/learner/hub actors.
    "ray[default]>=2.40,<3",
# Config: YAML -> frozen dataclasses via cattrs.
"cattrs>=23.2,<25",
"pyyaml>=6.0,<7",
# Notebook pivot tables / result frames.
"pandas>=2.2,<4",
    # Logging (D9: TensorBoard ONLY).
    "tensorboard>=2.18,<3",
    # Play CLI (D10) backend: rich for panels/tables/color; stdlib input() for prompts.
    "rich>=13.7,<14",
    # Small helpers.
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    "import-linter>=2.1,<3",
    "types-PyYAML>=6.0,<7",
    "matplotlib>=3.8,<4",  # plot helpers for the one-click notebook
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "pre-commit>=4.0,<5",
    # Step-0 symbolic derivations for the equilibrium atlas (D18): the Kuhn
    # alpha-family, the -1/18 game value, and the 3p indifference system whose
    # Jacobian null space gives m*. Dev-only — no runtime path imports sympy.
    "sympy>=1.13,<2",
    # Notebook execution (used to validate the one-click notebook from CLI).
    "jupyter>=1.1,<2",
    "ipykernel>=6.29,<7",
]

[project.scripts]
# D10: one-command launch of the play CLI.
mjai-play = "mjai.cli.main:main"
# Convenience entrypoints for training and evaluation.
mjai-train = "mjai.scripts.train:main"
mjai-eval = "mjai.scripts.evaluate:main"

# -----------------------------------------------------------------------------

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mjai"]

# -----------------------------------------------------------------------------

# Source layout: src/mjai/ is the import root.
[tool.setuptools]
# kept for tooling that reads it; hatchling is the actual backend.
package-dir = { "" = "src" }

# -----------------------------------------------------------------------------

# CUDA 12.8 wheel index for torch (D6: GPU by default, no silent degradation).
# The cu128 wheels are used for torch only, and only on CUDA-capable platforms;
# see the marker in [tool.uv.sources]. Everything else comes from PyPI.
[tool.uv]
# We do NOT set an index here unconditionally — torch's cu128 wheels live at the
# pytorch index below; everything else comes from PyPI.
[tool.uv.sources]
# Platform-conditional: cu128 wheels only exist for linux/windows NVIDIA. On
# those platforms torch resolves to the cu128 build (D6: GPU by default, fail
# loud). macOS has no CUDA build at all, so when the marker doesn't match uv
# falls back to the default PyPI index (CPU/MPS build); the CPU path then runs
# under --cpu / MJAI_CPU=1. (No silent degradation either way: the GPU path
# still errors via gpu_assert unless CPU is explicitly requested.)
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# -----------------------------------------------------------------------------

# Ruff: lint + format in one tool. Config lives here so editor integrations match CI.
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes (unused, undefined, etc.)
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "C4",       # comprehensions
    "SIM",      # simplify
    "PL",       # pylint subset
    "RUF",      # ruff-specific
    "PTH",      # use pathlib
    "NPY",      # numpy
]
ignore = [
    "E501",     # line length handled by formatter
    "PLR0913",  # too-many-arguments (we prefer explicit over *args)
    "PLR2004",  # magic-value-in-comparison (tests use literals)
    "B027",     # empty optional-override methods in ABCs (intentional hook pattern)
    "PLC0415",  # deliberate lazy imports (gpu_assert avoids torch; baselines avoid
                # heavy open_spiel solvers when only constants are needed). Each
                # lazy import is documented at its call site.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]  # asserts + magic values fine in tests
"scripts/**" = ["T201"]           # print is fine in scripts

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -----------------------------------------------------------------------------

# mypy: strict. Type errors are bugs.
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["mjai"]
strict = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
exclude = "^notebooks/"

# OpenSpiel's pybind11 stubs are incomplete; be lenient only there.
[[tool.mypy.overrides]]
module = ["pyspiel.*", "open_spiel.*"]
ignore_missing_imports = true

# Ray's type stubs are partial.
[[tool.mypy.overrides]]
module = ["ray.*"]
ignore_missing_imports = true

# torch ships without inline type stubs; mypy can't introspect C++ extensions.
[[tool.mypy.overrides]]
module = ["torch.*"]
ignore_missing_imports = true

# pipeline._ray builds Ray actor classes dynamically inside factory functions;
# the @ray.remote decorator produces objects whose methods mypy can't type-check
# meaningfully. The module is exercised only on a live Ray cluster (marked
# pragma: no cover); its typed surface is the Ray-free LocalIMPALARunner below.
[[tool.mypy.overrides]]
module = "mjai.pipeline._ray"
disable_error_code = ["no-untyped-def", "no-untyped-call"]

# -----------------------------------------------------------------------------

# import-linter: enforce the layering in AGENTS.md §2.
[tool.importlinter]
root_package = "mjai"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "mjai.cli",
    "mjai.pipeline",
    "mjai.certs",
    "mjai.eval",
    "mjai.atlas",
    "mjai.league",
    "mjai.algos | mjai.pach",
    "mjai.config",
    "mjai.seqform",
    "mjai.games | mjai.agents | mjai.mother",
    "mjai.utils",
]

[[tool.importlinter.contracts]]
name = "League does not depend on concrete algos"
type = "forbidden"
source_modules = ["mjai.league"]
forbidden_modules = [
    "mjai.algos.ppo",
    "mjai.algos.ach",
    "mjai.algos.trainer",
    "mjai.algos.baselines",
]

[[tool.importlinter.contracts]]
name = "CLI is a leaf — nothing imports it"
type = "forbidden"
source_modules = ["mjai.pipeline", "mjai.certs", "mjai.eval", "mjai.atlas", "mjai.league", "mjai.algos", "mjai.pach", "mjai.games", "mjai.agents", "mjai.mother", "mjai.config", "mjai.seqform", "mjai.utils"]
forbidden_modules = ["mjai.cli"]

# The research plan's central hard constraint, machine-checked (AGENTS.md §2, D12):
# the pACH training loop may only ever see fresh samples of the current population
# and its own terminal payoffs. No ground truth, no certificate, no exploitability
# oracle, no opponent pool. The layers contract above already implies this; this
# contract is deliberately redundant so the *intent* survives a future re-ordering
# of the layers rather than silently evaporating.
[[tool.importlinter.contracts]]
name = "pACH training loop is sealed off from the evaluation side"
type = "forbidden"
source_modules = ["mjai.pach", "mjai.mother"]
forbidden_modules = ["mjai.atlas", "mjai.eval", "mjai.certs", "mjai.league", "mjai.pipeline"]

# D14: atlas (Step-0 ground truth) and eval (the base stack's evaluators) are two
# independent legs of the three-way parity check. If atlas imported eval, the
# check would compare an implementation against itself.
[[tool.importlinter.contracts]]
name = "Atlas is an independent parity leg — it must not import eval"
type = "forbidden"
source_modules = ["mjai.atlas"]
forbidden_modules = ["mjai.eval"]

# -----------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
# -p no:cacheprovider: the cache serializes every parametrized node id to disk
# at session end; with ~thousands of parametrized cases across the suite this
# triggered a MemoryError on a 16 GB machine. The cache is only used for
# `--last-failed` / `--failed-first`, which we don't rely on.
addopts = "-ra --strict-markers --strict-config -p no:cacheprovider"
markers = [
    "gpu: tests that require a CUDA device (skipped without one)",
    "slow: tests that take more than a few seconds (excluded from fast suite)",
    "ray: tests that spin up a Ray cluster (excluded from fast suite)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:ray.*",
    "ignore::DeprecationWarning:tensorboard.*",
]
