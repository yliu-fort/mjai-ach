# Liar's Dice attribution L5a: does the tempering work once the CRITIC is right?
#
# docs/liars_residual_floor.md §8.9 eliminated the other three explanations for
# why weighting samples by reach(h)^-kappa helps in every offline setting and
# hurts in RL: row subsampling (the tempering still wins 2.1x at RL's exact
# 64-rows-per-step granularity), the moving target (in the exact dynamics the
# optimum is interior at kappa=0.5), and ACH's own 1/pi_old (PPO takes the same
# damage). What is left is advantage-estimation quality -- specifically that at
# rarely-reached information sets the critic's error is BIAS, not zero-mean
# noise, and the weight multiplies bias exactly as happily as signal.
#
# So this pair removes the critic from the advantage. `oracle_value: true`
# replaces the GAE baseline with the exact conditional expectation V(I) computed
# from the sequence form under the current profile, refreshed once per gradient
# step (mjai.eval.exact_value; +0.95 h over a 153k-step run). The return is
# still the sampled one, so the advantage is still noisy -- what is gone is the
# systematic part of the error.
#
# THIS IS AN INSTRUMENT, NOT AN ALGORITHM. It reads the whole game tree and the
# opponent's strategy; nothing about it survives to Mahjong scale or to an agent
# that has to learn from play. It emits ACHFidelityWarning and is not comparable
# to any paper curve.
#
# READ THE PAIR, NEVER AGAINST 0.1464 (the B=512 lesson, §8.7). An oracle
# baseline moves the floor on its own; the question is only whether kappa=0.5
# beats kappa=0 WITHIN this pair.
#
# STOPPING RULE, fixed before the run (§8.9): if the tempering still does not
# beat its paired control here, "flatten the visitation weighting" is dead as an
# actionable lever and the line closes.
# ARM: oracle_value=true, kappa=0.5. Oracle baseline + the tempering that cost the learned-critic arm 0.1464 -> 0.2636.
game: liars_dice1
algo: ach
self_play_mode: mirror
policy_kind: mlp
hidden_sizes: [256]
activation: relu
optimizer: sgd
learning_rate: 0.001
value_coef: 1.0
entropy_coef: 0.01
gae_lambda: 0.95
max_grad_norm: 0.0
eta: 1.0
l_th: 2.0
ratio_eps: 0.5
iw_clip: 20              # cap 1/pi_old (root-cause fix; None=paper)
sample_weight_kappa: 0.5    # weight = reach(h)^-kappa; 0 = paper
sample_weight_clip: 1000      # cap on that weight (bounds per-batch variance)
oracle_value: true       # exact V(s) baseline (instrument; see header)
target_samples: 64
episodes_per_round: 200
total_env_steps: 10000000
eval_every_env_steps: 100000
n_steps: 1000000
save_every_steps: 1000
eval_every_steps: 1000
eval_during_training: true
verbose: false
seed: 0
out_dir: runs/ab_oracle/liars_oracleV_k0.5_c1e3_seed0
hedge_eta: null
clip_eps: 0.2
league_capacity: 16
device: null
trunk_layernorm: true
gate_centered_logits: false
loss_centered_logits: false
# ---- D16 average-strategy anchor (AGENTS.md D16) ----
# "both" emits the uniform (theorem-stated) average under eval/avg_* and the
# linear/CFR+ average under eval/avg_*_lin from this one run.
track_average_policy: true
average_policy_weighting: both
