# Liar's Dice floor ablation: β-sweep arm (entropy_coef = 0).
# = liars_dice1_ach_mlp_anchor.yaml (paper-faithful mirror + D16 average anchor)
# with entropy_coef varied. Decisive test of whether the ~0.18 exploitability
# floor is the entropy regularizer (soft-equilibrium fixed point) or optimization
# error above it: if final exploitability -> 0 as β -> 0, the floor is entropy.
# β=1e-2 (the paper's value) is the committed anchor run; this is one of the
# lower-β arms. Deviation from the paper (β=1e-2) — see docs/liars_floor_ablation.md.
game: liars_dice1
algo: ach
self_play_mode: mirror
policy_kind: mlp
hidden_sizes: [128]
activation: relu
optimizer: sgd
learning_rate: 0.001
value_coef: 1.0
entropy_coef: 0.0     # β swept: {1e-2 (anchor), 3e-3, 1e-3, 1e-4, 0}
gae_lambda: 0.95
max_grad_norm: 0.0
eta: 1.0
l_th: 2.0
ratio_eps: 0.5
target_samples: 64
episodes_per_round: 200
total_env_steps: 10000000
eval_every_env_steps: 100000
n_steps: 1000000
save_every_steps: 1000
eval_every_steps: 1000
eval_during_training: true
verbose: false
seed: 0
out_dir: runs/ab_beta/liars_beta0_seed0
hedge_eta: null
clip_eps: 0.2
league_capacity: 16
device: null
trunk_layernorm: true
gate_centered_logits: false
loss_centered_logits: false
track_average_policy: true
average_policy_weighting: both
